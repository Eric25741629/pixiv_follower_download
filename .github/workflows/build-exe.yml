name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'tasks/**'
      - 'reports/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tasks/**'
      - 'reports/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          pip install `
            "flet==0.84.0" `
            "pyinstaller>=6.6" `
            "requests[socks]>=2.31" `
            "urllib3>=2.0" `
            "selenium>=4.0" `
            "beautifulsoup4>=4.12" `
            "pillow>=10.0" `
            "numpy>=1.26" `
            "tqdm>=4.66"

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name pixiv-img-download `
            --icon logo.ico `
            --add-data "logo.ico;." `
            --collect-all flet `
            --collect-submodules app `
            --collect-submodules selenium `
            --collect-submodules bs4 `
            --hidden-import pixiv_api `
            --hidden-import update_selenium `
            --hidden-import user_info `
            --hidden-import PIL `
            --hidden-import numpy `
            --hidden-import requests `
            --hidden-import urllib3 `
            --hidden-import socks `
            main.py

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/pixiv-img-download.exe")) {
            Write-Error "Build failed: dist/pixiv-img-download.exe not found"
            Get-ChildItem dist -Recurse -ErrorAction SilentlyContinue | Format-Table FullName, Length
            exit 1
          }
          $size = (Get-Item "dist/pixiv-img-download.exe").Length / 1MB
          Write-Host ("EXE size: {0:N1} MB" -f $size)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixiv-img-download-${{ github.sha }}
          path: dist/pixiv-img-download.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pixiv-img-download.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
